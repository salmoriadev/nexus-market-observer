[package]
name = "nexus-market-observer"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Fault-tolerant Rust service for ingesting, analyzing, persisting, and observing Nexus Exchange market data."
license = "MIT"
readme = "README.md"
publish = false
keywords = ["rust", "market-data", "nexus", "postgresql", "observability"]
categories = ["web-programming::http-server"]

[features]
default = []
postgres-integration = []

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
nexus-exchange = "=0.11.0"
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "rust_decimal"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
rust_decimal_macros = "1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
