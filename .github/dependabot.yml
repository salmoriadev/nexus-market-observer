version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-patch-updates:
        patterns: ["*"]
        update-types: ["patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns: ["*"]
    ignore:
      # Rust must move together in Cargo.toml, rust-toolchain.toml, CI, and Dockerfile.
      - dependency-name: rust
    open-pull-requests-limit: 5
