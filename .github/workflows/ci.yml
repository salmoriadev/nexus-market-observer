name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_market_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus_market_test
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-21
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: make audit
      - name: Validate Compose contracts
        run: make validate-compose
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build Docker image
        run: docker build --tag nexus-market-observer:ci .

  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create demo environment
        run: cp .env.example .env
      - name: Start deterministic demo
        run: make demo
      - name: Run end-to-end smoke test
        run: make smoke
      - name: Stop bridge demo before host-network check
        run: docker compose -p nexus-market-observer-demo down --volumes
      - name: Start independent PostgreSQL for external-database check
        run: |
          docker run --detach \
            --name nexus-external-postgres \
            --network host \
            --env POSTGRES_USER=nexus \
            --env POSTGRES_PASSWORD=nexus \
            --env POSTGRES_DB=nexus_market \
            postgres:17-bookworm \
            -c listen_addresses=127.0.0.1
          for _ in {1..30}; do
            if docker exec nexus-external-postgres pg_isready -U nexus -d nexus_market; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Start host-network demo with external PostgreSQL and alternate settings
        env:
          BACKEND_PORT: 18080
          DATABASE_URL: postgres://nexus:nexus@127.0.0.1:5432/nexus_market
          GRAFANA_PORT: 3300
          MARKET_DATA_SOURCE: replay
        run: >-
          docker compose
          --file docker-compose.yml
          --file docker-compose.host-network.yml
          --file docker-compose.external-db.yml
          --project-name nexus-market-observer-demo
          up --build --detach
      - name: Run host-network smoke test
        env:
          BACKEND_PORT: 18080
          GRAFANA_PORT: 3300
        run: make smoke
      - name: Validate smoke-test syntax
        run: bash -n scripts/smoke.sh scripts/audit.sh scripts/validate-compose.sh
      - name: Show container state
        if: always()
        run: >-
          docker compose
          --file docker-compose.yml
          --file docker-compose.host-network.yml
          --file docker-compose.external-db.yml
          --project-name nexus-market-observer-demo
          ps
      - name: Show service logs on failure
        if: failure()
        run: >-
          docker compose
          --file docker-compose.yml
          --file docker-compose.host-network.yml
          --file docker-compose.external-db.yml
          --project-name nexus-market-observer-demo
          logs --no-color
      - name: Stop deterministic demo
        if: always()
        run: >-
          docker compose
          --file docker-compose.yml
          --file docker-compose.host-network.yml
          --file docker-compose.external-db.yml
          --project-name nexus-market-observer-demo
          down --volumes
      - name: Stop independent PostgreSQL
        if: always()
        run: docker rm --force nexus-external-postgres 2>/dev/null || true
