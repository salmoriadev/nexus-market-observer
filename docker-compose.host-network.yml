services:
  backend:
    build:
      network: host
    network_mode: host
    ports: !reset []
    networks: !reset []
    extra_hosts:
      # Preserve DATABASE_URL exactly as configured. The default Compose
      # hostname resolves to the loopback-only PostgreSQL listener below.
      - "postgres:127.0.0.1"
    environment:
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: ${BACKEND_PORT:-8080}

  postgres:
    network_mode: host
    ports: !reset []
    networks: !reset []
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1

  prometheus:
    network_mode: host
    ports: !reset []
    networks: !reset []
    extra_hosts:
      - "backend:127.0.0.1"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sed "s|backend:8080|127.0.0.1:$${BACKEND_PORT}|g" /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.listen-address=127.0.0.1:9090

  grafana:
    network_mode: host
    ports: !reset []
    networks: !reset []
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
    extra_hosts:
      - "prometheus:127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:${GRAFANA_PORT:-3000}/api/health || exit 1"]
